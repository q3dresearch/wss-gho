<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="510" viewBox="0 0 1180 510"><rect width="1180" height="510" fill="#ffffff"/><text x="80.0" y="46.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" fill="#1c2530" text-anchor="start" font-weight="600">Most of WHO's indicator catalogue stopped being updated</text><text x="80.0" y="73.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#6b7684" text-anchor="start" font-weight="normal">When each of 337 randomly sampled indicators was last republished. Scoping by this alone picks the citable core.</text><rect x="112.0" y="339.7" width="136.0" height="60.3" fill="#eb6834" fill-opacity="0.9" stroke="none" stroke-width="1" rx="0"/><text x="180.0" y="329.7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#1c2530" text-anchor="middle" font-weight="600">48</text><text x="180.0" y="311.7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#eb6834" text-anchor="middle" font-weight="600">14%</text><text x="180.0" y="420.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#1c2530" text-anchor="middle" font-weight="600">&lt;1y</text><rect x="312.0" y="379.9" width="136.0" height="20.1" fill="#2a78d6" fill-opacity="0.5" stroke="none" stroke-width="1" rx="0"/><text x="380.0" y="369.9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#1c2530" text-anchor="middle" font-weight="600">16</text><text x="380.0" y="351.9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="middle" font-weight="600">5%</text><text x="380.0" y="420.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7684" text-anchor="middle" font-weight="normal">1–2y</text><rect x="512.0" y="307.0" width="136.0" height="93.0" fill="#2a78d6" fill-opacity="0.5" stroke="none" stroke-width="1" rx="0"/><text x="580.0" y="297.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#1c2530" text-anchor="middle" font-weight="600">74</text><text x="580.0" y="279.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="middle" font-weight="600">22%</text><text x="580.0" y="420.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7684" text-anchor="middle" font-weight="normal">2–4y</text><rect x="712.0" y="150.0" width="136.0" height="250.0" fill="#2a78d6" fill-opacity="0.5" stroke="none" stroke-width="1" rx="0"/><text x="780.0" y="140.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#1c2530" text-anchor="middle" font-weight="600">199</text><text x="780.0" y="122.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="middle" font-weight="600">59%</text><text x="780.0" y="420.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7684" text-anchor="middle" font-weight="normal">&gt;4y</text><line x1="80.0" y1="400.0" x2="880.0" y2="400.0" stroke="#6b7684" stroke-width="1"/><text x="906.0" y="154.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#eb6834" text-anchor="start" font-weight="600">The 14% republished within a year are the</text><text x="906.0" y="171.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#eb6834" text-anchor="start" font-weight="600">indicators anyone cites: under-five</text><text x="906.0" y="188.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#eb6834" text-anchor="start" font-weight="600">mortality, infant deaths, HIV in</text><text x="906.0" y="205.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#eb6834" text-anchor="start" font-weight="600">pregnancy, immunisation coverage, air</text><text x="906.0" y="222.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#eb6834" text-anchor="start" font-weight="600">pollution mortality.</text><text x="906.0" y="253.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">The dormant 59% are policy inventories</text><text x="906.0" y="270.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">last touched over four years ago —</text><text x="906.0" y="287.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">&quot;social costs of alcohol use&quot;,</text><text x="906.0" y="304.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">&quot;supervision requirements for</text><text x="906.0" y="321.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">buprenorphine&quot; — several stamped 13 years</text><text x="906.0" y="338.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">old.</text><text x="906.0" y="369.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="start" font-weight="normal">Capturing only the active set is</text><text x="906.0" y="386.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="start" font-weight="normal">therefore a mechanical rule, not a</text><text x="906.0" y="403.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="start" font-weight="normal">judgement about which indicators deserve</text><text x="906.0" y="420.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="start" font-weight="normal">to exist.</text><text x="80.0" y="478.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="start" font-weight="normal">Source: ghoapi.azureedge.net, 337 of 3,098 indicators drawn at random, 2026-09-07. Median last republication 4.7 years.</text></svg>