oboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="middle" font-weight="normal">2020s</text><line x1="84.0" y1="346.0" x2="940.0" y2="346.0" stroke="#6b7684" stroke-width="1"/><text x="84.0" y="434.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="start" font-weight="600">How many years each indicator actually spans</text><rect x="118.2" y="559.1" width="145.5" height="40.9" fill="#eb6834" fill-opacity="0.9" stroke="none" stroke-width="1" rx="0"/><text x="191.0" y="551.1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#1c2530" text-anchor="middle" font-weight="600">6</text><text x="191.0" y="618.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="middle" font-weight="600">one year</text><rect x="332.2" y="518.2" width="145.5" height="81.8" fill="#eb6834" fill-opacity="0.9" stroke="none" stroke-width="1" rx="0"/><text x="405.0" y="510.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#1c2530" text-anchor="middle" font-weight="600">12</text><text x="405.0" y="618.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="middle" font-weight="600">under 10</text><rect x="546.2" y="450.0" width="145.5" height="150.0" fill="#2a78d6" fill-opacity="0.6" stroke="none" stroke-width="1" rx="0"/><text x="619.0" y="442.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#1c2530" text-anchor="middle" font-weight="600">22</text><text x="619.0" y="618.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="middle" font-weight="normal">10–30</text><rect x="760.2" y="545.5" width="145.5" height="54.5" fill="#2a78d6" fill-opacity="0.6" stroke="none" stroke-width="1" rx="0"/><text x="833.0" y="537.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#1c2530" text-anchor="middle" font-weight="600">8</text><text x="833.0" y="618.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="middle" font-weight="normal">over 30</text><line x1="84.0" y1="600.0" x2="940.0" y2="600.0" stroke="#6b7684" stroke-width="1"/><text x="966.0" y="158.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="start" font-weight="normal">71% of every value describes the year</text><text x="966.0" y="175.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="start" font-weight="normal">2000 or later. Everything before 1960 is</text><text x="966.0" y="192.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="start" font-weight="normal">1.6% of the archive.</text><text x="966.0" y="221.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">Under-five mortality reaches 1931 and</text><text x="966.0" y="238.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">infant deaths 1951. They are two series</text><text x="966.0" y="255.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">out of forty-eight, and the deep past is</text><text x="966.0" y="272.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">a thin decorative tail rather than the</text><text x="966.0" y="289.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">bulk of the record.</text><text x="966.0" y="452.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#eb6834" text-anchor="start" font-weight="600">Only 8 indicators span more than thirty</text><text x="966.0" y="469.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#eb6834" text-anchor="start" font-weight="600">years. Six are a single year and are not</text><text x="966.0" y="486.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#eb6834" text-anchor="start" font-weight="600">time series at all — air pollution 2021,</text><text x="966.0" y="503.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#eb6834" text-anchor="start" font-weight="600">sexual violence 2023.</text><text x="84.0" y="670.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="start" font-weight="normal">Source: this repository's first capture, 2026-09-07. Values only; uncertainty bounds and load stamps excluded.</text></svg>