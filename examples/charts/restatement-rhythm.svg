ca,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="middle" font-weight="normal">Nov 2025</text><text x="385.9" y="403.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="middle" font-weight="normal">Jan 2026</text><text x="538.9" y="403.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="middle" font-weight="normal">Mar 2026</text><text x="691.8" y="403.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="middle" font-weight="normal">May 2026</text><text x="844.8" y="403.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="middle" font-weight="normal">Jul 2026</text><text x="936.0" y="162.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="start" font-weight="normal">25 distinct release dates across 48</text><text x="936.0" y="179.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="start" font-weight="normal">indicators — about two events a month.</text><text x="936.0" y="196.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="start" font-weight="normal">Orange marks a date carrying three or</text><text x="936.0" y="213.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="start" font-weight="normal">more.</text><text x="936.0" y="243.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#eb6834" text-anchor="start" font-weight="600">Revisions therefore arrive in batches. A</text><text x="936.0" y="260.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#eb6834" text-anchor="start" font-weight="600">monthly capture sits inside that rhythm;</text><text x="936.0" y="277.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#eb6834" text-anchor="start" font-weight="600">a daily one would re-fetch the same</text><text x="936.0" y="294.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#eb6834" text-anchor="start" font-weight="600">unchanged series about thirty times per</text><text x="936.0" y="311.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#eb6834" text-anchor="start" font-weight="600">release.</text><text x="936.0" y="341.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">Answered from the first capture. It is</text><text x="936.0" y="357.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">also the only question here that needed</text><text x="936.0" y="373.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">no second one.</text><text x="80.0" y="464.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="start" font-weight="normal">Source: ghoapi.azureedge.net, the Date field of the 48 indicators this repo captures, read 2026-09-07.</text></svg>