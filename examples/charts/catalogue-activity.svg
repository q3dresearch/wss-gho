<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="510" viewBox="0 0 1180 510"><rect width="1180" height="510" fill="#ffffff"/><text x="80.0" y="46.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" fill="#1c2530" text-anchor="start" font-weight="600">Most of WHO's indicator catalogue stopped being updated</text><text x="80.0" y="73.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#6b7684" text-anchor="start" font-weight="normal">When each of the 2,487 indicators carrying any data was last republished — the whole catalogue, not a sample.</text><text x="80.0" y="91.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#6b7684" text-anchor="start" font-weight="normal">Scoping by this alone picks the citable core.</text><rect x="112.0" y="319.2" width="136.0" height="80.8" fill="#eb6834" fill-opacity="0.9" stroke="none" stroke-width="1" rx="0"/><text x="180.0" y="309.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#1c2530" text-anchor="middle" font-weight="600">442</text><text x="180.0" y="291.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#eb6834" text-anchor="middle" font-weight="600">18%</text><text x="180.0" y="420.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#1c2530" text-anchor="middle" font-weight="600">&lt;1y</text><rect x="312.0" y="382.8" width="136.0" height="17.2" fill="#2a78d6" fill-opacity="0.5" stroke="none" stroke-width="1" rx="0"/><text x="380.0" y="372.8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#1c2530" text-anchor="middle" font-weight="600">94</text><text x="380.0" y="354.8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="middle" font-weight="600">4%</text><text x="380.0" y="420.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7684" text-anchor="middle" font-weight="normal">1–2y</text><rect x="512.0" y="293.2" width="136.0" height="106.8" fill="#2a78d6" fill-opacity="0.5" stroke="none" stroke-width="1" rx="0"/><text x="580.0" y="283.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#1c2530" text-anchor="middle" font-weight="600">584</text><text x="580.0" y="265.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="middle" font-weight="600">23%</text><text x="580.0" y="420.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7684" text-anchor="middle" font-weight="normal">2–4y</text><rect x="712.0" y="150.0" width="136.0" height="250.0" fill="#2a78d6" fill-opacity="0.5" stroke="none" stroke-width="1" rx="0"/><text x="780.0" y="140.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#1c2530" text-anchor="middle" font-weight="600">1367</text><text x="780.0" y="122.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="middle" font-weight="600">55%</text><text x="780.0" y="420.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7684" text-anchor="middle" font-weight="normal">&gt;4y</text><line x1="80.0" y1="400.0" x2="880.0" y2="400.0" stroke="#6b7684" stroke-width="1"/><text x="906.0" y="154.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#eb6834" text-anchor="start" font-weight="600">The 442 republished within a year — 18%</text><text x="906.0" y="171.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#eb6834" text-anchor="start" font-weight="600">of these, 14% of the whole catalogue —</text><text x="906.0" y="188.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#eb6834" text-anchor="start" font-weight="600">are the indicators anyone cites:</text><text x="906.0" y="205.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#eb6834" text-anchor="start" font-weight="600">under-five mortality, infant deaths, HIV</text><text x="906.0" y="222.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#eb6834" text-anchor="start" font-weight="600">in pregnancy, immunisation coverage, air</text><text x="906.0" y="239.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#eb6834" text-anchor="start" font-weight="600">pollution mortality.</text><text x="906.0" y="270.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">The dormant 55% are policy inventories</text><text x="906.0" y="287.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">last touched over four years ago —</text><text x="906.0" y="304.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">&quot;social costs of alcohol use&quot;,</text><text x="906.0" y="321.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">&quot;supervision requirements for</text><text x="906.0" y="338.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">buprenorphine&quot; — several stamped 13 years</text><text x="906.0" y="355.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">old.</text><text x="906.0" y="386.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="start" font-weight="normal">A further 612 of the 3,099 catalogued</text><text x="906.0" y="403.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="start" font-weight="normal">indicators carry no rows at all and</text><text x="906.0" y="420.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="start" font-weight="normal">cannot appear on this axis. Capturing</text><text x="906.0" y="437.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="start" font-weight="normal">only the active set is a mechanical rule,</text><text x="906.0" y="454.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="start" font-weight="normal">not a judgement about which deserve to</text><text x="906.0" y="471.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="start" font-weight="normal">exist.</text><text x="80.0" y="478.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="start" font-weight="normal">Source: ghoapi.azureedge.net, all 3,099 catalogued indicators polled 2026-09-22; 2,487 carry a load stamp and are shown, 612 hold no rows. Median last republication 4.4 years.</text></svg>