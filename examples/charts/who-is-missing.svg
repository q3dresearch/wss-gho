<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="518" viewBox="0 0 1300 518"><rect width="1300" height="518" fill="#ffffff"/><text x="84.0" y="46.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" fill="#1c2530" text-anchor="start" font-weight="600">The global health record is drawn along sovereignty lines</text><text x="84.0" y="73.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#6b7684" text-anchor="start" font-weight="normal">How many of the 48 captured indicators cover each of 230 places. The median is 37.</text><rect x="150.0" y="168.0" width="778.0" height="26.0" fill="#2a78d6" fill-opacity="0.55" stroke="none" stroke-width="1" rx="0"/><text x="140.0" y="184.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7684" text-anchor="end" font-weight="normal">36–48</text><text x="918.0" y="184.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#ffffff" text-anchor="end" font-weight="600">133 places</text><rect x="150.0" y="208.0" width="351.0" height="26.0" fill="#2a78d6" fill-opacity="0.55" stroke="none" stroke-width="1" rx="0"/><text x="140.0" y="224.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7684" text-anchor="end" font-weight="normal">24–35</text><text x="509.0" y="224.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1c2530" text-anchor="start" font-weight="normal">60 places</text><rect x="150.0" y="248.0" width="17.5" height="26.0" fill="#2a78d6" fill-opacity="0.55" stroke="none" stroke-width="1" rx="0"/><text x="140.0" y="264.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7684" text-anchor="end" font-weight="normal">10–23</text><text x="175.5" y="264.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1c2530" text-anchor="start" font-weight="normal">3 places</text><rect x="150.0" y="288.0" width="93.6" height="26.0" fill="#eb6834" fill-opacity="0.9" stroke="none" stroke-width="1" rx="0"/><text x="140.0" y="304.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="end" font-weight="600">2–9</text><text x="251.6" y="304.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1c2530" text-anchor="start" font-weight="normal">16 places</text><rect x="150.0" y="328.0" width="105.3" height="26.0" fill="#eb6834" fill-opacity="0.9" stroke="none" stroke-width="1" rx="0"/><text x="140.0" y="344.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="end" font-weight="600">exactly 1</text><text x="263.3" y="344.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1c2530" text-anchor="start" font-weight="normal">18 places</text><text x="140.0" y="154.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">indicators</text><line x1="150.0" y1="281.0" x2="928.0" y2="281.0" stroke="#1c2530" stroke-width="1" stroke-dasharray="4,3"/><text x="476.8" y="274.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal" font-style="italic">only 3 places sit between — the drop is a cliff, not a gradient</text><text x="952.0" y="164.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="start" font-weight="normal">The 18 places covered by exactly one</text><text x="952.0" y="180.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="start" font-weight="normal">indicator are every one of them a territory</text><text x="952.0" y="196.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="start" font-weight="normal">or dependency, not a sovereign state:</text><text x="952.0" y="218.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#eb6834" text-anchor="start" font-weight="600">Bonaire, Saint Eustatius and Saba, Cayman</text><text x="952.0" y="233.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#eb6834" text-anchor="start" font-weight="600">Islands, Curaçao, Falkland Islands</text><text x="952.0" y="248.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#eb6834" text-anchor="start" font-weight="600">(Malvinas), Faroe Islands, Gibraltar,</text><text x="952.0" y="263.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#eb6834" text-anchor="start" font-weight="600">Guadeloupe, Guam, Isle of Man, Martinique,</text><text x="952.0" y="278.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#eb6834" text-anchor="start" font-weight="600">New Caledonia, Northern Mariana Islands,</text><text x="952.0" y="293.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#eb6834" text-anchor="start" font-weight="600">Reunion, Saint Pierre and Miquelon, Sint</text><text x="952.0" y="308.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#eb6834" text-anchor="start" font-weight="600">Maarten (Dutch part), St Helena, Ascension</text><text x="952.0" y="323.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#eb6834" text-anchor="start" font-weight="600">and Tristan da Cunha, Virgin Islands (USA),</text><text x="952.0" y="338.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#eb6834" text-anchor="start" font-weight="600">Wallis and Futuna Islands</text><text x="952.0" y="363.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">The single indicator reaching them is basic</text><text x="952.0" y="379.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">drinking water — produced by the WHO/UNICEF</text><text x="952.0" y="395.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">Joint Monitoring Programme, which counts</text><text x="952.0" y="411.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">places by geography rather than by</text><text x="952.0" y="427.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">statehood.</text><text x="952.0" y="453.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1c2530" text-anchor="start" font-weight="600">Réunion has about 870,000 residents and</text><text x="952.0" y="469.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#1c2530" text-anchor="start" font-weight="600">appears in one indicator of forty-eight.</text><text x="84.0" y="488.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="start" font-weight="normal">Source: this repository's first capture, 2026-09-07. Places as listed in the GHO COUNTRY dimension; regional aggregates excluded.</text></svg>